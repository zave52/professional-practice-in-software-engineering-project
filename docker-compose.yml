services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-app_admin}
      POSTGRES_DB: ${POSTGRES_DB:-cicd_hub_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-zave52/professional-practice-in-software-engineering-project}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cicd_hub_db}
      PGUSER: ${POSTGRES_USER:-app_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pg_data:
