# Production stack. Images are built by GitHub Actions and pulled from GHCR (IMAGE_TAG is the
# commit SHA, written to .env by deploy/deploy.sh). The `build:` sections keep
# `docker compose up --build` working for local development.
name: cicd-dashboard

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-app_admin}
      POSTGRES_DB: ${POSTGRES_DB:-cicd_hub_db}
    # Reachable only from the host itself (for example through an SSH tunnel), never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/zave52/professional-practice-in-software-engineering-project}/server:${IMAGE_TAG:-latest}
    build:
      context: ./server
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      API_ORIGIN: ${API_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cicd_hub_db}
      PGUSER: ${POSTGRES_USER:-app_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    # No published port: the API is reachable only through the frontend reverse proxy.
    expose:
      - "5000"

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/zave52/professional-practice-in-software-engineering-project}/client:${IMAGE_TAG:-latest}
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pg_data:
